  <text x="40" y="500" font-size="11" fill="#8a7464" font-style="italic">Wired: USB-C -&gt; bridge -&gt; storage (bypasses radio). Wireless: phone &lt;-&gt; radio &lt;-&gt; storage. Never both at once.</text>
