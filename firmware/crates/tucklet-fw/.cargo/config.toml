# ESP32-C5 is RISC-V. Confirm the exact target triple against your installed
# esp toolchain (espup); esp32c5 support requires a recent ESP-IDF + Rust esp
# channel. The C6/C5 RISC-V target is riscv32imac-esp-espidf.
[build]
target = "riscv32imac-esp-espidf"

[target.riscv32imac-esp-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32c5"
ESP_IDF_VERSION = "v5.4"
