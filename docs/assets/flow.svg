<svg viewBox="0 0 920 540" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7f1"/>
      <stop offset="1" stop-color="#f4ece1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8806f"/>
      <stop offset="1" stop-color="#b5654f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#7a5a48" flood-opacity="0.18"/>
    </filter>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9a7a66"/>
    </marker>
  </defs>

  <rect width="920" height="540" fill="url(#bg)"/>
  <text x="46" y="56" font-size="30" fill="#3a2c23" font-weight="bold">Tucklet — how it works</text>
  <text x="46" y="82" font-size="15" fill="#8a7464" font-style="italic">Pair once. After that it's invisible: near your phone, it just connects and keeps your memories safe.</text>

  <!-- Flow row -->
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <!-- Step 1 -->
    <g filter="url(#soft)">
      <rect x="46" y="116" width="156" height="92" rx="16" fill="#ffffff"/>
    </g>
    <circle cx="70" cy="142" r="11" fill="url(#accent)"/>
    <text x="70" y="147" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
    <text x="92" y="146" font-size="15" fill="#3a2c23" font-weight="bold">Pair once</text>
    <text x="62" y="172" font-size="12" fill="#6f5b4c">Tap the charm to</text>
    <text x="62" y="189" font-size="12" fill="#6f5b4c">your phone. One time.</text>

    <!-- Step 2 -->
    <g filter="url(#soft)"><rect x="238" y="116" width="156" height="92" rx="16" fill="#ffffff"/></g>
    <circle cx="262" cy="142" r="11" fill="url(#accent)"/>
    <text x="262" y="147" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
    <text x="284" y="146" font-size="15" fill="#3a2c23" font-weight="bold">Browse</text>
    <text x="254" y="172" font-size="12" fill="#6f5b4c">Thumbnails only —</text>
    <text x="254" y="189" font-size="12" fill="#6f5b4c">instant, no big load.</text>

    <!-- Step 3 -->
    <g filter="url(#soft)"><rect x="430" y="116" width="156" height="92" rx="16" fill="#ffffff"/></g>
    <circle cx="454" cy="142" r="11" fill="url(#accent)"/>
    <text x="454" y="147" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
    <text x="476" y="146" font-size="15" fill="#3a2c23" font-weight="bold">See the time</text>
    <text x="446" y="172" font-size="12" fill="#6f5b4c">"30 photos · ~15s"</text>
    <text x="446" y="189" font-size="12" fill="#6f5b4c">before it starts.</text>

    <!-- Step 4 -->
    <g filter="url(#soft)"><rect x="622" y="116" width="252" height="92" rx="16" fill="#ffffff"/></g>
    <circle cx="646" cy="142" r="11" fill="url(#accent)"/>
    <text x="646" y="147" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
    <text x="668" y="146" font-size="15" fill="#3a2c23" font-weight="bold">Now, or automatically</text>
    <text x="638" y="172" font-size="12" fill="#6f5b4c">Batch now (with live ETA), or let it</text>
    <text x="638" y="189" font-size="12" fill="#6f5b4c">trickle in the background so it's always done.</text>

    <line x1="202" y1="162" x2="236" y2="162" stroke="#9a7a66" stroke-width="2" marker-end="url(#arw)"/>
    <line x1="394" y1="162" x2="428" y2="162" stroke="#9a7a66" stroke-width="2" marker-end="url(#arw)"/>
    <line x1="586" y1="162" x2="620" y2="162" stroke="#9a7a66" stroke-width="2" marker-end="url(#arw)"/>
  </g>

  <!-- States -->
  <g font-family="system-ui, sans-serif">
    <text x="46" y="252" font-size="15" fill="#3a2c23" font-weight="bold">Every item, in plain words (never "cache"):</text>
    <g filter="url(#soft)"><rect x="46" y="266" width="250" height="46" rx="12" fill="#ffffff"/></g>
    <text x="64" y="294" font-size="14" fill="#3a2c23" font-weight="bold">On phone</text>
    <text x="150" y="294" font-size="12" fill="#6f5b4c">lives on the phone</text>

    <g filter="url(#soft)"><rect x="312" y="266" width="250" height="46" rx="12" fill="#ffffff"/></g>
    <text x="330" y="294" font-size="14" fill="#3a2c23" font-weight="bold">On Tucklet</text>
    <text x="424" y="294" font-size="12" fill="#6f5b4c">lives on the charm</text>

    <g filter="url(#soft)"><rect x="578" y="266" width="296" height="46" rx="12" fill="#ffffff"/></g>
    <text x="596" y="294" font-size="14" fill="#3a2c23" font-weight="bold">Temporary</text>
    <text x="690" y="294" font-size="12" fill="#6f5b4c">auto-removes when you say</text>
  </g>

  <!-- Layered architecture -->
  <g font-family="system-ui, sans-serif">
    <text x="46" y="356" font-size="15" fill="#3a2c23" font-weight="bold">Three connections, used in layers:</text>

    <g filter="url(#soft)"><rect x="46" y="372" width="400" height="60" rx="14" fill="#fff"/></g>
    <rect x="46" y="372" width="8" height="60" rx="4" fill="#7d9b86"/>
    <text x="66" y="398" font-size="14" fill="#3a2c23" font-weight="bold">BLE — control &amp; auth</text>
    <text x="66" y="418" font-size="12" fill="#6f5b4c">find, connect, battery %, wake. Tiny power.</text>

    <g filter="url(#soft)"><rect x="46" y="444" width="400" height="60" rx="14" fill="#fff"/></g>
    <rect x="46" y="444" width="8" height="60" rx="4" fill="#c8806f"/>
    <text x="66" y="470" font-size="14" fill="#3a2c23" font-weight="bold">Wi-Fi (5 GHz / Wi-Fi Aware) — everyday data</text>
    <text x="66" y="490" font-size="12" fill="#6f5b4c">~9 MB/s up close; on only while transferring.</text>

    <g filter="url(#soft)"><rect x="474" y="372" width="400" height="132" rx="14" fill="#fff"/></g>
    <rect x="474" y="372" width="8" height="132" rx="4" fill="#9a7a66"/>
    <text x="494" y="398" font-size="14" fill="#3a2c23" font-weight="bold">USB-C bridge — plug in for bulk</text>
    <text x="494" y="418" font-size="12" fill="#6f5b4c">~20-40 MB/s. A whole library in minutes.</text>
    <text x="494" y="444" font-size="12" fill="#6f5b4c">Also charges the charm and shows up as a</text>
    <text x="494" y="461" font-size="12" fill="#6f5b4c">normal fast drive on a computer.</text>
    <text x="494" y="487" font-size="11.5" fill="#8a7464" font-style="italic">microSD or eMMC inside · C5 or dual-C5 radio</text>
  </g>
</svg>
